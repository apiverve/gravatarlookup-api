openapi: 3.0.4
info:
  title: Gravatar Lookup
  description: >-
    Gravatar Lookup fetches public Gravatar profiles and avatar image URLs for
    any email address. It returns the user's display name, username, biography,
    location, company, and job title.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/gravatarlookup:
    get:
      summary: Gravatar Lookup
      description: Lookup the Gravatar profile of an email address
      operationId: gravatarlookup
      parameters:
        - name: email
          in: query
          schema:
            type: string
          required: true
          description: The email address to lookup the Gravatar profile of
          example: hello@apiverve.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  profileUrl: https://gravatar.com/apiverve
                  thumbnailUrl: https://0.gravatar.com/avatar/f4d2e1d9263acab05f6a553dfdd4884a1efb8e6d76bd276a50996b3a41e1d6e5
                  photos:
                    - value: https://0.gravatar.com/avatar/f4d2e1d9263acab05f6a553dfdd4884a1efb8e6d76bd276a50996b3a41e1d6e5
                      type: thumbnail
                  displayName: APIVerve
                  aboutMe: >-
                    APIVerve stands out as a premier source for cloud-based API
                    and Software-as-a-Service (SaaS) solutions catering to
                    developers, startups and products.


                    At APIVerve, we take pride in being a leading provider of
                    cutting-edge cloud-based API and Software-as-a-Service
                    (SaaS) solutions tailored to meet the diverse needs and
                    unlock new possibilities across various industries.
                  currentLocation: United States
                  company: APIVerve
                  jobTitle: ''
                  username: apiverve
                  contactInfo: []
                  accounts:
                    - domain: twitter
                      display: X
                      url: https://x.com/apivervehq
                      verified: true
                      name: Twitter
                    - domain: calendly
                      display: Calendly
                      url: https://calendly.com/apiverve
                      verified: true
                      name: Calendly
                    - domain: github
                      display: GitHub
                      url: https://github.com/apivervehq
                      verified: true
                      name: Github
                  accountCount: 3
                  verifiedAccountCount: 3
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
